# Netlify static deploy (Vite SPA — no Node server required)
# Dashboard: set repo root, leave build/publish blank if this file is present.
# Optional cloud backup: Site settings → Environment variables → add VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY

[build]
  command = "pnpm run build:netlify"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing (wouter): every path serves the SPA shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
